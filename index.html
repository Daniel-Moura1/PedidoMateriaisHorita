<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitação de Materiais | Horita</title>

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header-container">
        <div>
            <h2>Pedido de Materiais</h2>
            <p style="color: #666; margin-top: 5px;">Selecione a categoria e busque os itens desejados.</p>
        </div>
        <img src="Logo Horita.png" alt="Logo Horita" class="logo">
    </header>

    <main>
        <section class="filtros-container">
            <div class="campo-grupo">
                <label for="fazenda">Fazenda:*</label>
                <select id="fazenda">
                    <option value="" disabled selected>Selecione a Fazenda...</option>
                    <option value="Faz. Arizona">Faz. Arizona</option>
                    <option value="Faz. Vitoria">Faz. Vitoria</option>
                    <option value="Faz. Australia">Faz. Australia</option>
                    <option value="Faz. Colorado">Faz. Colorado</option>
                    <option value="Faz. Acalanto">Faz. Acalanto</option>
                    <option value="Faz. Roda Velha">Faz. Roda Velha</option>
                    <option value="Faz. Timbauba">Faz. Timbauba</option>
                    <option value="Faz. Anda Luz">Faz. Anda Luz</option>
                    <option value="Faz. Sagarana">Faz. Sagarana</option>
                    <option value="Faz. Requinte">Faz. Requinte</option>
                    <option value="Algodoeira">Algodoeira</option>
                </select>
            </div>

            <div class="campo-grupo">
                <label for="aplicacao">Onde será aplicado:*</label>
                <input type="text" id="aplicacao" placeholder="Ex: Refeitório, Alojamento..." style="width: 250px;">
            </div>

            <div class="campo-grupo">
                <label for="categoria">Categoria:</label>
                <select id="categoria" onchange="trocarCategoria()">
                    <option value="" disabled selected>Selecione a categoria...</option>
                    <option value="construcao">Mats. Construção</option>
                    <option value="hidraulico">Mats. Hidráulicos</option>
                    <option value="pintura">Mats. Pinturas</option>
                    <option value="eletrico">Mats. Elétricos</option>
                    <option value="ferragem">Mats. Ferragens</option>
                    <option value="jardinagem">Mats. Jardinagens</option>
                    <option value="equipamentos">Mats. Equipamentos</option>
                    <option value="ferramenta_manual">Ferramentas Manuais</option>
                    <option value="pecas_acessorios">Peças e Acessórios</option>
                </select>
            </div>

            <div class="campo-grupo" style="position: relative; flex-grow: 1;">
                <label for="busca">Produto:</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="busca" 
                        onkeyup="buscarProduto()" 
                        onclick="this.select()" 
                        placeholder="Digite o nome ou código..." 
                        autocomplete="off" style="flex-grow: 1;">
                    
                    <button type="button" onclick="adicionarManual()" class="btn-manual">
                        + Item Manual
                    </button>
                </div>
                <div id="resultados"></div>
            </div>
        </section>

        <section class="tabela-container">
            <table id="tabela">
                <thead>
                    <tr>
                        <th style="width: 80px;">Código</th>
                        <th>Descrição do Material</th>
                        <th style="width: 120px;">Qtd.*</th>
                        <th style="width: 150px;">Marca</th>
                        <th style="width: 120px;">Cor</th>
                        <th>Observações</th>
                        <th style="width: 50px;">Ação</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </section>

    <footer class="acoes-container">
        <button class="btn-excel" onclick="exportarExcel()">Exportar Excel</button>
        <button class="btn-pdf" onclick="exportarPDF()">Exportar PDF</button> 
        <button class="btn-email" onclick="enviarEmail()">Enviar E-mail</button>
        <button class="btn-refresh" onclick="refreshSistema()">Limpar</button>
    </footer>
    </main>

    <script src="script.js"></script>

</body>
</html>
